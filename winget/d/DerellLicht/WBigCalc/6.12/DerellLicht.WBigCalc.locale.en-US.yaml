ShortDescription: WBigCalc is an extended-precision RPN (Reverse Polish Notation) scientific calculator.
Description: |-
  WBigCalc is an extended-precision scientific calculator, supporting numbers up to 1075 digits.
  WBigCalc uses Reverse Polish Notation (RPN), as originally used in HP calculators;
  RPN is an efficient method for handling complex computations, but is rarely seen in pocket calculators any more.
